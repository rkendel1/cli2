[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/rkendel1/cli2"
rust-version = "1.82"

[workspace.dependencies]
cli2-core = { path = "crates/cli2-core" }
cli2-discovery = { path = "crates/cli2-discovery" }
cli2-index = { path = "crates/cli2-index" }
cli2-resolver = { path = "crates/cli2-resolver" }
cli2-execution = { path = "crates/cli2-execution" }
cli2-evidence = { path = "crates/cli2-evidence" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
ctrlc = "3"
hex = "0.4"
jsonschema = { version = "0.60", default-features = false }
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"
uuid = { version = "1", features = ["v4"] }
